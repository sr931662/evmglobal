steps:
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - build
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/evmglobal/evmglobal:$COMMIT_SHA'
      - '--builder=gcr.io/buildpacks/builder:latest'
      - '--path=server'
    id: Buildpack

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/evmglobal/evmglobal:$COMMIT_SHA'
    id: Push

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - evmglobal
      - '--platform=managed'
      - '--region=europe-west1'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/evmglobal/evmglobal:$COMMIT_SHA'
    id: Deploy

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/evmglobal/evmglobal:$COMMIT_SHA'
